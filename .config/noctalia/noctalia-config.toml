[backdrop]
enabled = true

[bar.default]
capsule = true
center = [ "media" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "status",
    "clock",
    "session"
]
position = "bottom"
thickness = 32
widget_spacing = 4

[config]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 2378.0
    output = "DP-2"
    placement_height = 2560.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "davemhammer/tailscale" ]

[shell]
panel_anchor_bar = "default"

    [shell.panel]
    clipboard_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    transparency_mode = "soft"

    [shell.screenshot]
    annotate = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "scroll", "starship" ]

[wallpaper.default]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.last]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.monitors.DP-1]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.monitors.DP-2]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[widget.battery]
enabled = false

[widget.control-center]
enabled = false

[widget.status]
type = "davemhammer/tailscale:status"

[widget.volume]
show_label = false
