[notification]
position = "bottom_right"

[osd]
orientation = "vertical"
position = "bottom_right"
position_vertical = "center_right"

[plugins]
enabled = [ "davemhammer/tailscale" ]

[shell]
clipboard_history_max_entries = 10000
panel_anchor_bar = "default"
polkit_agent = true

    [shell.launcher]
    show_app_actions = true
    width = 880

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    transparency_mode = "soft"

    [shell.screenshot]
    annotate = true
    close_on_save = false
    skip_annotate_on_copy_save = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "scroll", "starship" ]

[wallpaper.default]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.last]
path = "/home/gegeh/Pictures/Wallpapers/os-x-snow-leopard-5120x3200-24052.jpg"

[wallpaper.monitors.DP-1]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.monitors.DP-2]
path = "/home/gegeh/Pictures/Wallpapers/os-x-snow-leopard-5120x3200-24052.jpg"

[widget.battery]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
art_size = 32
max_length = 348
show_progress = true
title_scroll = "on_hover"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.volume]
show_label = false

[widget.wallpaper]
enabled = false
