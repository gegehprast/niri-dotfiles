[backdrop]
enabled = true

[bar.default]
capsule = true
center = [ "media" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "status",
    "clock",
    "session"
]
position = "bottom"
thickness = 32
widget_spacing = 4

[config]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1250.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 2378.0
    output = "DP-2"
    placement_height = 2560.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 3108.0
    cy = 237.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "calendar"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 192.0
    box_width = 832.0
    cx = 1720.0
    cy = 720.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        bands = 32
        show_when_idle = true

[notification]
position = "bottom_right"

[osd]
orientation = "vertical"
position = "bottom_right"
position_vertical = "center_right"

[plugins]
enabled = [ "davemhammer/tailscale" ]

[shell]
clipboard_history_max_entries = 5000
panel_anchor_bar = "default"

    [shell.launcher]
    show_app_actions = true
    width = 880

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    transparency_mode = "soft"

    [shell.screenshot]
    annotate = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "scroll", "starship" ]

[wallpaper.default]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.last]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.monitors.DP-1]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[wallpaper.monitors.DP-2]
path = "/home/gegeh/Pictures/Wallpapers/jr-korpa-9XngoIpxcEo-unsplash.jpg"

[widget.battery]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
art_size = 32
max_length = 348
show_progress = true
title_scroll = "on_hover"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.volume]
show_label = false

[widget.wallpaper]
enabled = false
